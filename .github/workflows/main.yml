

name: Build Donut Boy Pro APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK, CMake and Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Build optimised release APK
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q project.zip -d "$RUNNER_TEMP/proj"

          if [ -f update.zip ]; then
            unzip -q -o update.zip -d "$RUNNER_TEMP/proj"
          fi

          cd "$RUNNER_TEMP/proj"
          chmod +x gradlew

          ./gradlew :app:assembleRelease --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk/DonutBoyPro.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DonutBoyPro-apk
          path: apk/DonutBoyPro.apk
