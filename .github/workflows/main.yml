name: Build Donut Boy Pro APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install NDK, CMake and platform (SDK is preinstalled on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q project.zip -d "$RUNNER_TEMP/proj"
          if [ -f update.zip ]; then unzip -q -o update.zip -d "$RUNNER_TEMP/proj"; fi
          cd "$RUNNER_TEMP/proj"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk/DonutBoyPro-debug.apk"
      - uses: actions/upload-artifact@v4
        with: { name: DonutBoyPro-debug-apk, path: apk/DonutBoyPro-debug.apk }
