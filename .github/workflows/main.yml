name: Build Donut Boy Pro APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q project.zip -d "$RUNNER_TEMP/proj"
          cd "$RUNNER_TEMP/proj"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk/DonutBoyPro-debug.apk"
      - uses: actions/upload-artifact@v4
        with: { name: DonutBoyPro-debug-apk, path: apk/DonutBoyPro-debug.apk }
