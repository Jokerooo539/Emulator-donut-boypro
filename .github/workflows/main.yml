name: Build Donut Boy Pro APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses || true

          "$SDKM" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/proj"

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found project: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/proj"

          test -f "$RUNNER_TEMP/proj/gradlew" || {
            echo "ERROR: gradlew not found!"
            exit 1
          }

      - name: Build debug APK
        run: |
          cd "$RUNNER_TEMP/proj"

          chmod +x gradlew

          ./gradlew :app:assembleDebug --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/apk/DonutBoyPro-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DonutBoyPro-debug-apk
          path: apk/DonutBoyPro-debug.apk
          
